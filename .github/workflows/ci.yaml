name: Build & Deploy to Kind
on:
  push:
    branches: [main]
    paths:
      - app/**

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: firewood2002/notiflex-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}

      - name: Update deployment manifest
        run: |
          IMAGE="${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}"
          sed -i "s|image: .*notiflex-api.*|image: ${IMAGE}|" k8s/smb/rollout.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/smb/rollout.yaml
          git commit -m "ci: update image to $IMAGE"
          git push "https://x-access-token:${GH_PAT}@github.com/yoonjaeyol/_Book_GitAIOps.git" main
        env:
          GH_PAT: ${{ secrets.GH_PAT }}