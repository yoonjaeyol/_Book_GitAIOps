name: Build & Deploy to Kind
on:
  push:
    branches: [main]
    paths:
      - app/**

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: yoonjaeyol/notiflex-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}

      - name: Update deployment manifest
        run: |
          IMAGE="${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}"
          sed -i "s|image: .*|image: ${IMAGE}|" k8s/smb/deployment.yaml
          git config user.name yoonjaeyol
          git config user.email yoonjaeyol@gmail.com
          git add k8s/smb/deployment.yaml
          git commit --allow-empty -m "ci: update image to $IMAGE"
          git push
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}