# MetalLB 구성 (chart 0.16.x — ConfigMap 대신 CR 사용)
# pool: LAN(10.10.20.0/24) 공중 대역 — ARP 스윜(2026-08-19) 기준 100~140 전체 공중
# kind(docker bridge 172.18.0.0/16) → k3s(bare-metal, 노드 br0) 전환과 함께 대역 변경
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: notiflex
  namespace: metallb
spec:
  addresses:
  - 10.10.20.100-10.10.20.140
  autoAssign: false   # 지정 IP 할당 (재현성)
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: notiflex
  namespace: metallb
spec:
  interfaces:
  - br0   # k3s 노드의 LAN 인터페이스 (kind는 docker bridge br-*)
  ipAddressPools:
  - notiflex