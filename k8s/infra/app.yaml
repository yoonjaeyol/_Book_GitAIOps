# ArgoCD 앱: k8s/infra (Gateway API CRD + MetalLB + Traefik)
# notiflex-smb(k8s/smb)와 분리 — 인프라/앱 관심사 분리
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notiflex-infra
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb   # namespaced 리소스 fallback (manifest에 ns 명시된 것은 그대로)
  source:
    repoURL: https://github.com/yoonjaeyol/_Book_GitAIOps.git
    targetRevision: main
    path: k8s/infra
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    # Gateway API v1.6.x의 httproutes CRD(~474KB)는 클라이언트사이드 apply의
    # last-applied-configuration 256KB 한도를 초과 → "metadata.annotations: Too long".
    # ServerSideApply는 last-applied를 쓰지 않아 이 문제를 우회 (Gateway API 공식 권장:
    # `kubectl apply --server-side --force-conflicts -f gateway-api-install.yaml`).
    - ServerSideApply=true