# Gateway API: 외부 HTTP 트래픽 → notiflex-api
# Gateway(인프라) + HTTPRoute(앱) 분리 — GKE 대신 Traefik GatewayClass(traefik)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: notiflex-gateway
  namespace: notiflex
spec:
  gatewayClassName: traefik
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same   # 같은 ns(notiflex)의 HTTPRoute만 바인딩
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: notiflex-route
  namespace: notiflex
spec:
  parentRefs:
  - name: notiflex-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: notiflex-api
      port: 80